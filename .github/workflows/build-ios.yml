name: Build ParentVision iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd apps/ios
          xcodegen generate
          # Ensure maximum compatibility across Xcode 15 and 16
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' ParentVision.xcodeproj/project.pbxproj || true

      - name: Build iOS App (.ipa)
        run: |
          cd apps/ios
          xcodebuild -project ParentVision.xcodeproj \
            -scheme ParentVision \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          mkdir -p ipa-build/Payload
          cp -r build/Build/Products/Release-iphoneos/ParentVision.app ipa-build/Payload/
          if [ -d "build/Build/Products/Release-iphoneos/ParentVisionBroadcastUpload.appex" ] && [ ! -d "ipa-build/Payload/ParentVision.app/PlugIns/ParentVisionBroadcastUpload.appex" ]; then
            mkdir -p ipa-build/Payload/ParentVision.app/PlugIns
            cp -r build/Build/Products/Release-iphoneos/ParentVisionBroadcastUpload.appex ipa-build/Payload/ParentVision.app/PlugIns/
          fi

          # Ensure everything is writable and force replace Info.plist files with exact metadata
          chmod -R u+w ipa-build
          cp -f ParentVision/Resources/Info.plist ipa-build/Payload/ParentVision.app/Info.plist
          cp -f ParentVisionBroadcastUpload/Info.plist ipa-build/Payload/ParentVision.app/PlugIns/ParentVisionBroadcastUpload.appex/Info.plist

          python3 -c "
          import plistlib, os

          main_plist = 'ipa-build/Payload/ParentVision.app/Info.plist'
          if os.path.exists(main_plist):
              with open(main_plist, 'rb') as f:
                  p = plistlib.load(f)
              p['CFBundleIdentifier'] = 'com.parentvision.ParentVision'
              p['CFBundleExecutable'] = 'ParentVision'
              p['CFBundleDisplayName'] = 'ParentVision'
              p['CFBundleName'] = 'ParentVision'
              p['NSCameraUsageDescription'] = 'ParentVision uses the camera to scan the parent pairing QR code.'
              p['NSFamilyControlsUsageDescription'] = 'ParentVision requires Screen Time and Family Controls permissions.'
              with open(main_plist, 'wb') as f:
                  plistlib.dump(p, f)
              print('Sanitized main app plist with bundle ID & descriptions')

          ext_plist = 'ipa-build/Payload/ParentVision.app/PlugIns/ParentVisionBroadcastUpload.appex/Info.plist'
          if os.path.exists(ext_plist):
              with open(ext_plist, 'rb') as f:
                  p = plistlib.load(f)
              p['CFBundleIdentifier'] = 'com.parentvision.ParentVision.BroadcastUpload'
              p['CFBundleExecutable'] = 'ParentVisionBroadcastUpload'
              p['CFBundleDisplayName'] = 'ParentVision Live Broadcaster'
              p['CFBundleName'] = 'ParentVisionBroadcastUpload'
              p['NSExtension'] = {
                  'NSExtensionPointIdentifier': 'com.apple.broadcast-services-upload',
                  'NSExtensionPrincipalClass': 'ParentVisionBroadcastUpload.SampleHandler',
                  'RPBroadcastProcessMode': 'RPBroadcastProcessModeSampleBuffer'
              }
              with open(ext_plist, 'wb') as f:
                  plistlib.dump(p, f)
              print('Sanitized app extension plist with NSExtension dictionary')
          "

          cd ipa-build && zip -r ../ParentVision.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParentVision-iOS-IPA
          path: apps/ios/ParentVision.ipa
