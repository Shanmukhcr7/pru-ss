name: ParentVision
options:
  bundleIdPrefix: com.parentvision
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: "" # Set your Apple Developer Team ID here
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST: NO

targets:
  ParentVision:
    type: application
    platform: iOS
    sources:
      - path: ParentVision
    entitlements:
      path: ParentVision/Resources/ParentVision.entitlements
    info:
      path: ParentVision/Resources/Info.plist
    settings:
      GENERATE_INFOPLIST: NO
      INFOPLIST_FILE: ParentVision/Resources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.parentvision.ParentVision
    dependencies:
      - target: ParentVisionBroadcastUpload
        embed: true
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: ReplayKit.framework
      - sdk: Security.framework

  ParentVisionBroadcastUpload:
    type: app-extension
    platform: iOS
    sources:
      - path: ParentVisionBroadcastUpload
      - path: ParentVision/Services/AppGroupBridge.swift
    entitlements:
      path: ParentVisionBroadcastUpload/ParentVisionBroadcastUpload.entitlements
    info:
      path: ParentVisionBroadcastUpload/Info.plist
    settings:
      GENERATE_INFOPLIST: NO
      INFOPLIST_FILE: ParentVisionBroadcastUpload/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.parentvision.ParentVision.BroadcastUpload
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: Network.framework
