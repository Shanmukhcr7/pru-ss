version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: parentvision-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword!}
      POSTGRES_DB: ${POSTGRES_DB:-parentvision}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../services/api/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parentvision-net

  # 2. Node.js & TypeScript Backend API + Signaling
  api:
    build:
      context: ../../services/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: parentvision-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword!}@postgres:5432/${POSTGRES_DB:-parentvision}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_DEVICE_SECRET: ${JWT_DEVICE_SECRET}
      JWT_SESSION_SECRET: ${JWT_SESSION_SECRET}
      TURN_SECRET: ${TURN_SECRET}
      TURN_REALM: ${TURN_REALM:-turn.parentvision.app}
      TURN_URLS: ${TURN_URLS:-stun:stun.l.google.com:19302,turn:turn.parentvision.app:3478?transport=udp}
      CORS_ORIGIN: https://${DOMAIN:-parentvision.app}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - parentvision-net

  # 3. Next.js Parent Dashboard
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: parentvision-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-parentvision.app}
      NEXT_PUBLIC_WS_URL: wss://${DOMAIN:-parentvision.app}
    networks:
      - parentvision-net

  # 4. Coturn STUN/TURN Media Relay Server
  coturn:
    image: coturn/coturn:latest
    container_name: parentvision-coturn
    restart: always
    network_mode: host
    volumes:
      - ../coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  # 5. Caddy Reverse Proxy & Automatic Let's Encrypt TLS
  caddy:
    image: caddy:2-alpine
    container_name: parentvision-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-parentvision.app}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - parentvision-net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  parentvision-net:
    driver: bridge
