# ParentVision Coturn TURN Server Configuration

# Listening ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# External relay IP (Set to your Hostinger VPS Public IPv4)
# external-ip=YOUR_PUBLIC_IP

# Min and max relay UDP ports
min-port=49152
max-port=65535

# Enable RFC 5766 REST API ephemeral time-limited credentials
use-auth-secret
static-auth-secret=CHANGE_ME_PRODUCTION_TURN_SECRET_KEY_VERY_SECURE
realm=turn.parentvision.app

# Security & performance
fingerprint
lt-cred-mech
stale-nonce
no-cli
no-loopback-peers
no-multicast-peers

# Logging
verbose
log-file=stdout
